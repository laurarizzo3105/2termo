<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dino Run</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f7f7f7;
    font-family: monospace;
    overflow: hidden;
    user-select: none;
}

#game {
    width: 100%;
    height: 300px;
    position: relative;
    overflow: hidden;
    background: #f7f7f7;
    border-bottom: 3px solid #555;
}

#score {
    position: absolute;
    top: 15px;
    right: 25px;
    font-size: 20px;
    color: #555;
    z-index: 10;
}

#highscore {
    position: absolute;
    top: 15px;
    left: 25px;
    font-size: 20px;
    color: #777;
}

#message {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 90px;
    font-size: 25px;
    color: #555;
    z-index: 20;
}

#ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 4px;
    background: #555;
}

/* DINOSSAURO */

#dino {
    position: absolute;
    left: 80px;
    bottom: 4px;

    width: 50px;
    height: 55px;

    background: #555;

    border-radius: 5px;

    z-index: 5;
}

/* cabeça */

#dino::before {
    content: "";

    position: absolute;

    width: 32px;
    height: 30px;

    background: #555;

    right: -10px;
    top: 0;

    border-radius: 4px;
}

/* olho */

#dino::after {
    content: "";

    position: absolute;

    width: 5px;
    height: 5px;

    background: white;

    right: -3px;
    top: 7px;
}

/* pernas */

.leg {
    position: absolute;

    width: 9px;
    height: 22px;

    background: #555;

    bottom: -18px;
}

.leg1 {
    left: 8px;
}

.leg2 {
    left: 27px;
}

/* braços */

.arm {
    position: absolute;

    width: 20px;
    height: 7px;

    background: #555;

    right: -10px;
    top: 30px;

    transform: rotate(20deg);
}

/* AGACHADO */

#dino.crouch {
    height: 32px;
    bottom: 4px;
}

#dino.crouch::before {
    top: 0;
}

#dino.crouch .leg {
    height: 10px;
    bottom: -8px;
}

/* PULO */

#dino.jump {
    animation: jump 0.65s ease-out;
}

@keyframes jump {

    0% {
        bottom: 4px;
    }

    45% {
        bottom: 150px;
    }

    100% {
        bottom: 4px;
    }
}

/* CACTO */

.cactus {
    position: absolute;

    bottom: 4px;

    width: 22px;
    height: 55px;

    background: #555;

    border-radius: 3px;
}

.cactus::before,
.cactus::after {
    content: "";

    position: absolute;

    width: 13px;
    height: 25px;

    background: #555;

    top: 20px;
}

.cactus::before {
    left: -10px;
    border-radius: 4px 0 0 4px;
}

.cactus::after {
    right: -10px;
    border-radius: 0 4px 4px 0;
}

/* PÁSSARO */

.bird {
    position: absolute;

    width: 45px;
    height: 18px;

    background: #555;

    border-radius: 50%;

    z-index: 4;
}

.bird::before {
    content: "";

    position: absolute;

    width: 28px;
    height: 8px;

    background: #555;

    left: 5px;
    top: 12px;

    transform: rotate(-20deg);
}

.bird::after {
    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    background: white;

    right: 5px;
    top: 4px;
}

/* NUVENS */

.cloud {
    position: absolute;

    width: 70px;
    height: 20px;

    background: #ddd;

    border-radius: 20px;

    top: 50px;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background: #ddd;

    border-radius: 50%;
}

.cloud::before {
    width: 30px;
    height: 30px;
    left: 10px;
    top: -15px;
}

.cloud::after {
    width: 35px;
    height: 35px;
    right: 10px;
    top: -20px;
}

/* GAME OVER */

.gameover {
    position: absolute;

    top: 125px;

    width: 100%;

    text-align: center;

    font-size: 25px;

    color: #555;

    display: none;

    z-index: 30;
}

button {
    margin-top: 15px;

    padding: 10px 20px;

    border: 2px solid #555;

    background: transparent;

    color: #555;

    font-family: monospace;

    cursor: pointer;

    font-size: 16px;
}

button:hover {
    background: #555;
    color: white;
}

/* CELULAR */

@media(max-width:600px) {

    #game {
        height: 250px;
    }

    #dino {
        left: 40px;
    }

    #score,
    #highscore {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="score">
        00000
    </div>

    <div id="highscore">
        HI 00000
    </div>

    <div id="message">
        PRESSIONE ESPAÇO PARA COMEÇAR
    </div>

    <div id="dino">

        <div class="leg leg1"></div>
        <div class="leg leg2"></div>

        <div class="arm"></div>

    </div>

    <div id="ground"></div>

    <div class="gameover" id="gameover">

        GAME OVER

        <br>

        <button onclick="restartGame()">
            ↻ JOGAR NOVAMENTE
        </button>

    </div>

</div>


<script>

/* =========================
   VARIÁVEIS
========================= */

const game = document.getElementById("game");
const dino = document.getElementById("dino");

const scoreText = document.getElementById("score");
const highscoreText = document.getElementById("highscore");

const message = document.getElementById("message");
const gameover = document.getElementById("gameover");

let playing = false;
let gameOver = false;

let score = 0;
let highscore = Number(localStorage.getItem("dinoHighscore")) || 0;

let speed = 6;

let obstacleTimer;
let scoreTimer;

highscoreText.innerText =
    "HI " + String(highscore).padStart(5, "0");


/* =========================
   COMEÇAR
========================= */

function startGame() {

    if (playing) return;

    playing = true;
    gameOver = false;

    score = 0;
    speed = 6;

    message.style.display = "none";
    gameover.style.display = "none";

    scoreText.innerText = "00000";

    createObstacle();

    scoreTimer = setInterval(() => {

        score++;

        scoreText.innerText =
            String(score).padStart(5, "0");

        /* aumenta velocidade */

        if (score % 100 === 0) {

            speed += 0.5;

        }

        /* recorde */

        if (score > highscore) {

            highscore = score;

            highscoreText.innerText =
                "HI " + String(highscore).padStart(5, "0");

            localStorage.setItem(
                "dinoHighscore",
                highscore
            );
        }

    }, 100);

}


/* =========================
   PULAR
========================= */

function jump() {

    if (!playing) {

        startGame();

    }

    if (gameOver) return;

    if (
        dino.classList.contains("jump") ||
        dino.classList.contains("crouch")
    ) {

        return;

    }

    dino.classList.add("jump");

    setTimeout(() => {

        dino.classList.remove("jump");

    }, 650);

}


/* =========================
   AGACHAR
========================= */

function crouch() {

    if (!playing) {

        startGame();

    }

    if (gameOver) return;

    if (dino.classList.contains("jump")) return;

    dino.classList.add("crouch");

}


/* =========================
   PARAR AGACHAMENTO
========================= */

function stopCrouch() {

    dino.classList.remove("crouch");

}


/* =========================
   CONTROLES
========================= */

document.addEventListener("keydown", function(event) {

    if (
        event.code === "Space" ||
        event.code === "ArrowUp"
    ) {

        event.preventDefault();

        jump();

    }

    if (event.code === "ArrowDown") {

        event.preventDefault();

        crouch();

    }

});


document.addEventListener("keyup", function(event) {

    if (event.code === "ArrowDown") {

        stopCrouch();

    }

});


/* =========================
   CRIAR OBSTÁCULOS
========================= */

function createObstacle() {

    if (!playing || gameOver) return;

    const obstacle = document.createElement("div");

    let isBird = Math.random() > 0.75;

    if (isBird) {

        obstacle.classList.add("bird");

        let height =
            Math.random() > 0.5
                ? 100
                : 150;

        obstacle.style.bottom =
            height + "px";

    } else {

        obstacle.classList.add("cactus");

        if (Math.random() > 0.7) {

            obstacle.style.height = "70px";

        }

    }

    obstacle.style.left =
        game.offsetWidth + "px";

    game.appendChild(obstacle);

    moveObstacle(obstacle);

}


/* =========================
   MOVER OBSTÁCULO
========================= */

function moveObstacle(obstacle) {

    let x = game.offsetWidth;

    function move() {

        if (!playing || gameOver) {

            obstacle.remove();

            return;

        }

        x -= speed;

        obstacle.style.left =
            x + "px";

        checkCollision(obstacle);

        if (x < -100) {

            obstacle.remove();

            setTimeout(
                createObstacle,
                Math.random() * 1000 + 600
            );

            return;

        }

        requestAnimationFrame(move);

    }

    move();

}


/* =========================
   COLISÃO
========================= */

function checkCollision(obstacle) {

    const d =
        dino.getBoundingClientRect();

    const o =
        obstacle.getBoundingClientRect();

    const margem = 8;

    if (

        d.right - margem > o.left &&
        d.left + margem < o.right &&
        d.bottom - margem > o.top &&
        d.top + margem < o.bottom

    ) {

        endGame();

    }

}


/* =========================
   GAME OVER
========================= */

function endGame() {

    if (gameOver) return;

    gameOver = true;
    playing = false;

    clearInterval(scoreTimer);

    gameover.style.display = "block";

}


/* =========================
   REINICIAR
========================= */

function restartGame() {

    document
        .querySelectorAll(".cactus, .bird")
        .forEach(el => el.remove());

    dino.classList.remove("jump");
    dino.classList.remove("crouch");

    gameover.style.display = "none";

    playing = false;
    gameOver = false;

    startGame();

}


/* =========================
   NUVENS
========================= */

function createCloud() {

    const cloud =
        document.createElement("div");

    cloud.classList.add("cloud");

    cloud.style.left =
        game.offsetWidth + "px";

    cloud.style.top =
        Math.random() * 80 + 20 + "px";

    game.appendChild(cloud);

    let x = game.offsetWidth;

    function moveCloud() {

        x -= 1;

        cloud.style.left =
            x + "px";

        if (x < -100) {

            cloud.remove();

            return;

        }

        requestAnimationFrame(moveCloud);

    }

    moveCloud();

}


/* cria nuvens */

setInterval(() => {

    if (playing) {

        createCloud();

    }

}, 2500);


/* =========================
   CLIQUE / CELULAR
========================= */

game.addEventListener("mousedown", function() {

    jump();

});


game.addEventListener("touchstart", function(event) {

    event.preventDefault();

    jump();

});


/* =========================
   INÍCIO
========================= */

message.addEventListener("click", startGame);

</script>

</body>
</html>
