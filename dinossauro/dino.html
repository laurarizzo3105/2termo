<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Runner</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f7f7f7;
    font-family: monospace;
    overflow: hidden;
    touch-action: manipulation;
}

#game {
    position: relative;
    width: 100%;
    height: 320px;
    margin-top: 70px;
    background: white;
    border-bottom: 4px solid #555;
    overflow: hidden;
}

#score {
    position: absolute;
    top: 15px;
    right: 25px;
    color: #555;
    font-size: 20px;
    z-index: 50;
}

/* =========================
   DINO
========================= */

#dino {
    position: absolute;
    left: 80px;
    bottom: 4px;
    width: 58px;
    height: 60px;
    z-index: 10;
}

/* corpo */
.dino-body {
    position: absolute;
    left: 8px;
    bottom: 5px;
    width: 38px;
    height: 39px;
    background: #333;
    border-radius: 12px 7px 5px 8px;
}

/* cabeça */
.dino-head {
    position: absolute;
    left: 30px;
    top: 3px;
    width: 31px;
    height: 28px;
    background: #333;
    border-radius: 6px 10px 4px 4px;
    z-index: 3;
}

/* focinho */
.dino-snout {
    position: absolute;
    left: 54px;
    top: 16px;
    width: 12px;
    height: 10px;
    background: #333;
    border-radius: 2px 5px 4px 2px;
    z-index: 4;
}

/* olho */
.dino-eye {
    position: absolute;
    left: 49px;
    top: 9px;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    z-index: 6;
}

.dino-eye::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 2px;
    background: black;
    left: 2px;
    top: 2px;
}

/* barriga */
.dino-belly {
    position: absolute;
    left: 17px;
    bottom: 10px;
    width: 21px;
    height: 20px;
    background: #444;
    border-radius: 50%;
}

/* braço */
.dino-arm {
    position: absolute;
    left: 36px;
    bottom: 18px;
    width: 17px;
    height: 6px;
    background: #333;
    border-radius: 5px;
    transform: rotate(20deg);
    z-index: 5;
}

/* cauda */
.tail {
    position: absolute;
    left: -16px;
    bottom: 22px;
    width: 28px;
    height: 10px;
    background: #333;
    border-radius: 8px;
    transform: rotate(-20deg);
}

/* pernas */
.leg {
    position: absolute;
    bottom: -4px;
    width: 10px;
    height: 20px;
    background: #333;
    border-radius: 3px;
}

.leg1 {
    left: 12px;
}

.leg2 {
    right: 8px;
}

/* pés */
.leg::after {
    content: "";
    position: absolute;
    left: -3px;
    bottom: 0;
    width: 16px;
    height: 5px;
    background: #333;
    border-radius: 3px;
}

/* espinhos */
.dino-spikes {
    position: absolute;
    left: 10px;
    top: 8px;
    color: #333;
    font-size: 10px;
    letter-spacing: 1px;
    z-index: 7;
}

/* =========================
   DINO AGACHADO
========================= */

#dino.crouching {
    height: 38px;
}

#dino.crouching .dino-body {
    height: 27px;
    bottom: 4px;
}

#dino.crouching .dino-head {
    top: 2px;
}

#dino.crouching .dino-snout {
    top: 14px;
}

#dino.crouching .dino-arm {
    bottom: 10px;
}

#dino.crouching .leg {
    height: 10px;
}

#dino.crouching .tail {
    bottom: 12px;
}

/* =========================
   CACTOS
========================= */

.cactus {
    position: absolute;
    bottom: 4px;
    background: #287a35;
    border-radius: 8px 8px 3px 3px;
}

/* pequeno */
.cactus.small {
    width: 17px;
    height: 35px;
}

/* médio */
.cactus.medium {
    width: 24px;
    height: 55px;
}

/* grande */
.cactus.large {
    width: 31px;
    height: 78px;
}

/* braços */
.cactus::before {
    content: "";
    position: absolute;
    left: -9px;
    top: 45%;
    width: 11px;
    height: 22px;
    background: #287a35;
    border-radius: 7px;
}

.cactus::after {
    content: "";
    position: absolute;
    right: -9px;
    top: 20%;
    width: 11px;
    height: 25px;
    background: #287a35;
    border-radius: 7px;
}

/* =========================
   PÁSSARO
========================= */

.bird {
    position: absolute;
    width: 45px;
    height: 22px;
    background: #444;
    border-radius: 50%;
    z-index: 8;
}

.bird::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 10px;
    width: 28px;
    height: 6px;
    background: #444;
    border-radius: 5px;
    transform: rotate(25deg);
}

.bird::after {
    content: "";
    position: absolute;
    right: -10px;
    top: 6px;
    border-left: 10px solid #444;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
}

/* =========================
   NUVENS
========================= */

.cloud {
    position: absolute;
    width: 70px;
    height: 22px;
    background: #ddd;
    border-radius: 30px;
    opacity: .7;
}

.cloud::before {
    content: "";
    position: absolute;
    width: 30px;
    height: 30px;
    left: 10px;
    top: -12px;
    background: #ddd;
    border-radius: 50%;
}

.cloud::after {
    content: "";
    position: absolute;
    width: 38px;
    height: 38px;
    right: 5px;
    top: -20px;
    background: #ddd;
    border-radius: 50%;
}

/* =========================
   MENSAGEM
========================= */

#message {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #555;
    text-align: center;
    z-index: 40;
}

#message h1 {
    font-size: 28px;
    margin-bottom: 15px;
}

#message p {
    font-size: 15px;
    margin: 3px;
}

.hidden {
    display: none !important;
}

/* =========================
   CONTROLES MOBILE
========================= */

#controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 10px;
    z-index: 100;
}

button {
    border: 0;
    background: #333;
    color: white;
    padding: 14px 25px;
    border-radius: 10px;
    font-family: monospace;
    font-size: 16px;
}

@media (max-width: 700px) {
    #game {
        margin-top: 30px;
    }

    #controls {
        display: flex;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="score">00000</div>

    <div id="message">
        <h1>DINO RUNNER</h1>
        <p>ESPAÇO / ↑ = PULAR</p>
        <p>↓ = AGACHAR</p>
        <br>
        <p>Clique ou toque para começar</p>
    </div>

    <div id="dino">

        <div class="dino-spikes">▲▲▲</div>

        <div class="dino-body"></div>

        <div class="dino-head"></div>

        <div class="dino-snout"></div>

        <div class="dino-eye"></div>

        <div class="dino-belly"></div>

        <div class="dino-arm"></div>

        <div class="leg leg1"></div>
        <div class="leg leg2"></div>

        <div class="tail"></div>

    </div>

</div>

<div id="controls">
    <button id="jumpBtn">PULAR</button>
    <button id="crouchBtn">AGACHAR</button>
</div>

<script>

/* =========================
   ELEMENTOS
========================= */

const game = document.getElementById("game");
const dino = document.getElementById("dino");
const scoreEl = document.getElementById("score");
const message = document.getElementById("message");

const jumpBtn = document.getElementById("jumpBtn");
const crouchBtn = document.getElementById("crouchBtn");


/* =========================
   ESTADO DO JOGO
========================= */

let running = false;
let score = 0;

let highScore =
    Number(localStorage.getItem("dinoHighScore")) || 0;

let dinoY = 0;
let velocity = 0;

const gravity = 0.8;
const jumpPower = 15;

let speed = 7;

let obstacles = [];
let clouds = [];

let lastTime = 0;
let lastObstacle = 0;

let obstacleDelay = 1200;


/* =========================
   INICIAR
========================= */

function startGame() {

    if (running) return;

    running = true;

    score = 0;
    speed = 7;

    dinoY = 0;
    velocity = 0;

    dino.classList.remove("crouching");

    /* limpar obstáculos */

    obstacles.forEach(o => {
        o.el.remove();
    });

    obstacles = [];

    /* limpar nuvens */

    clouds.forEach(c => {
        c.el.remove();
    });

    clouds = [];

    message.classList.add("hidden");

    lastTime = performance.now();
    lastObstacle = performance.now();

    requestAnimationFrame(loop);
}


/* =========================
   PULAR
========================= */

function jump() {

    if (!running) {
        startGame();
        return;
    }

    if (dinoY === 0) {

        velocity = jumpPower;

        dino.classList.remove("crouching");
    }
}


/* =========================
   AGACHAR
========================= */

function crouch() {

    if (!running) return;

    if (dinoY === 0) {
        dino.classList.add("crouching");
    }
}

function stopCrouch() {
    dino.classList.remove("crouching");
}


/* =========================
   CRIAR CACTO / PÁSSARO
========================= */

function createObstacle() {

    const el = document.createElement("div");

    /* pássaro */

    if (score >= 200 && Math.random() < 0.25) {

        el.className = "bird";

        const heights = [
            75,
            105,
            135,
            160
        ];

        const h =
            heights[
                Math.floor(
                    Math.random() * heights.length
                )
            ];

        el.style.bottom = h + "px";

        game.appendChild(el);

        obstacles.push({
            el: el,
            x: game.clientWidth + 40,
            bird: true
        });

        return;
    }


    /* cacto */

    const sizes = [
        "small",
        "medium",
        "large"
    ];

    const size =
        sizes[
            Math.floor(
                Math.random() * sizes.length
            )
        ];

    el.className =
        "cactus " + size;

    game.appendChild(el);

    obstacles.push({
        el: el,
        x: game.clientWidth + 40,
        bird: false
    });
}


/* =========================
   NUVEM
========================= */

function createCloud() {

    const el = document.createElement("div");

    el.className = "cloud";

    const x = game.clientWidth + 50;

    el.style.left = x + "px";

    el.style.top =
        (25 + Math.random() * 100) + "px";

    game.appendChild(el);

    clouds.push({
        el: el,
        x: x
    });
}


/* =========================
   COLISÃO
========================= */

function hit(a, b) {

    const r1 = a.getBoundingClientRect();
    const r2 = b.getBoundingClientRect();

    const padding = 6;

    return (
        r1.left + padding < r2.right &&
        r1.right - padding > r2.left &&
        r1.top + padding < r2.bottom &&
        r1.bottom - padding > r2.top
    );
}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    running = false;

    const finalScore =
        Math.floor(score);

    if (finalScore > highScore) {

        highScore = finalScore;

        localStorage.setItem(
            "dinoHighScore",
            highScore
        );
    }

    message.innerHTML = `
        <h1>GAME OVER</h1>

        <p>Pontuação: ${String(finalScore).padStart(5, "0")}</p>

        <p>Recorde: ${String(highScore).padStart(5, "0")}</p>

        <br>

        <p>ESPAÇO ou clique para jogar novamente</p>
    `;

    message.classList.remove("hidden");
}


/* =========================
   LOOP
========================= */

function loop(time) {

    if (!running) return;

    const delta =
        Math.min(time - lastTime, 40);

    lastTime = time;


    /* =====================
       FÍSICA DO DINO
    ===================== */

    if (dinoY > 0 || velocity > 0) {

        velocity -= gravity;

        dinoY += velocity;

        if (dinoY <= 0) {

            dinoY = 0;
            velocity = 0;
        }
    }

    dino.style.bottom =
        (dinoY + 4) + "px";


    /* =====================
       OBSTÁCULOS
    ===================== */

    if (
        time - lastObstacle >
        obstacleDelay
    ) {

        createObstacle();

        lastObstacle = time;

        obstacleDelay =
            Math.max(
                600,
                1100 -
                Math.floor(score / 100) * 35
            ) +
            Math.random() * 500;
    }


    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const o = obstacles[i];

        o.x -=
            speed *
            (delta / 16);

        o.el.style.left =
            o.x + "px";


        /* colisão */

        if (hit(dino, o.el)) {

            gameOver();

            return;
        }


        /* saiu da tela */

        if (o.x < -100) {

            o.el.remove();

            obstacles.splice(i, 1);
        }
    }


    /* =====================
       NUVENS
    ===================== */

    if (Math.random() < 0.003) {
        createCloud();
    }


    for (
        let i = clouds.length - 1;
        i >= 0;
        i--
    ) {

        const c = clouds[i];

        c.x -=
            speed *
            0.25 *
            (delta / 16);

        c.el.style.left =
            c.x + "px";


        if (c.x < -100) {

            c.el.remove();

            clouds.splice(i, 1);
        }
    }


    /* =====================
       PONTUAÇÃO
    ===================== */

    score +=
        delta * 0.01;

    scoreEl.textContent =
        String(
            Math.floor(score)
        ).padStart(5, "0");


    /* =====================
       AUMENTAR VELOCIDADE
    ===================== */

    speed =
        7 +
        Math.floor(score / 100) * 0.45;


    requestAnimationFrame(loop);
}


/* =========================
   TECLADO
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.code === "Space" ||
            e.code === "ArrowUp"
        ) {

            e.preventDefault();

            jump();
        }

        if (e.code === "ArrowDown") {

            e.preventDefault();

            crouch();
        }
    }
);


document.addEventListener(
    "keyup",
    function(e) {

        if (e.code === "ArrowDown") {
            stopCrouch();
        }
    }
);


/* =========================
   MOUSE
========================= */

game.addEventListener(
    "mousedown",
    function() {
        jump();
    }
);


/* =========================
   CELULAR
========================= */

game.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        jump();

    },
    { passive: false }
);


jumpBtn.addEventListener(
    "click",
    function() {
        jump();
    }
);


crouchBtn.addEventListener(
    "mousedown",
    function(e) {

        e.preventDefault();

        crouch();
    }
);


crouchBtn.addEventListener(
    "mouseup",
    stopCrouch
);


crouchBtn.addEventListener(
    "mouseleave",
    stopCrouch
);


crouchBtn.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        crouch();

    },
    { passive: false }
);


crouchBtn.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();

        stopCrouch();

    },
    { passive: false }
);

</script>

</body>
</html>
