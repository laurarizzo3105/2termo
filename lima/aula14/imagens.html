<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>revisao imagens e videos</title>
    <link rel="stylesheet" href="imagens.css">
</head>
<body>
    <h1> trabalhando com imagens</h1>
    <h2>imagem responsiva basica</h2>
    <figure class="resp-bas">
        <img src="https://i.pinimg.com/736x/be/e5/75/bee575e744df3ebd2ddce1b3ad2da87b.jpg" alt="imagem 1">
    </figure>

    <h2>imagem com recorte</h2>
    <figure class="img-rec">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwwBZHmBfywn-8GcQhuBlgRQ95cDck4ArdPzdkxUQiTBlDv38Jq2xpffLC&s=10" alt="imagem 2">
    </figure>

    <h2>imgem em formato de cards</h2>
    <figure class="img-card">
        <img src="https://i.pinimg.com/736x/db/9f/13/db9f1341e50766375a00820058e29ec3.jpg" alt="imagem 3">
    </figure>

    <h2>personalizacao</h2>
    <figure class="pers-img">
        <img src="https://i.pinimg.com/736x/0b/4e/10/0b4e10d945fcb3a0e9f4513fd584338f.jpg" alt="imagem 4">
    </figure>

    <h2>Imagens em Grid</h2>
    <section class="sec-grid">
        <article class="img-grid">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQOK6vFampBb2j1fO6Z7yG2oFbqKffXXLSn4GTpvp4seRBOjZF8nadKprg&s=10" alt="Imagem 5">
        </article>
        <article class="img-grid">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWaz7fShYA3CY9G-C-XakXdtDJatZSCnBY5ZkUdsgJJg6xwZOogpXlf3md&s=10" alt="Imagem 6">
        </article>
        <article class="img-grid">
            <img src="https://m.media-amazon.com/images/I/71TqAfhp7zL._AC_UF894,1000_QL80_.jpg" alt="Imagem 7">
        </article>
    </section>

    <section class="video">
    <h2>Trailer do Filme</h2>
    <iframe width="560" height="315" src="https://youtube.com/shorts/kGN9Z0mI8Lk?si=jx3M8gtyTimdMnXg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</section>
</body>
</html>
